{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">

        <h2 class="fw-bold">
            Operations Analytics
        </h2>

        <p class="text-muted">
            Relocation status overview.
        </p>

    </div>

    <!-- KPI Cards -->

    <div class="row g-4 mb-4">

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <h6>Total Relocations</h6>

                    <h2>{{ total }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <h6>Active Relocations</h6>

                    <h2>{{ planning|add:progress }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <h6>Completed Relocations</h6>

                    <h2>{{ completed }}</h2>

                </div>

            </div>

        </div>

    </div>

    <!-- Chart -->

    <div class="card shadow-sm">

        <div class="card-header bg-white">

            <h5 class="mb-0">
                Relocation Status Distribution
            </h5>

        </div>

        <div class="card-body">

            <div style="max-width:450px; margin:auto;">

                <canvas id="statusChart"></canvas>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const ctx = document.getElementById('statusChart');

new Chart(ctx, {

    type: 'pie',

    data: {

        labels: [

            'Planning',

            'In Progress',

            'Completed'

        ],

        datasets: [{

            data: [

                {{ planning }},

                {{ progress }},

                {{ completed }}

            ],

            backgroundColor: [

                '#0d6efd',

                '#ffc107',

                '#198754'

            ],

            borderWidth: 2,

            borderColor: '#ffffff'

        }]

    },

    options: {

        responsive: true,

        plugins: {

            legend: {

                position: 'bottom'

            },

            tooltip: {

                enabled: true

            }

        }

    }

});

</script>

{% endblock %}
