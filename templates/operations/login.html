{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | QuickMove Operations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
        <div class="card shadow-sm border-0 w-100" style="max-width: 430px;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-truck text-primary fs-1"></i>
                    <h2 class="fw-bold mt-2 mb-1">QuickMove</h2>
                    <p class="text-muted mb-0">Sign in to manage operations.</p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger">Please check your username and password.</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>
                    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                </form>

                <div class="alert alert-light border mt-4 mb-0 small">
                    <strong>Demo credentials</strong><br>
                    Username: <code>admin</code><br>
                    Password: <code>admin</code>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
